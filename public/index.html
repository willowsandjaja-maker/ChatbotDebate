<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Debate Bots</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Reusable head silhouette (faces right). Mirrored for bot "b" via CSS. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="head" viewBox="0 0 230 280">
        <path d="M22 280 L50 196 C22 174 6 140 8 100 C12 42 58 6 114 8 C164 10 192 48 190 96
                 L187 120 L226 150 L188 154 C182 159 181 165 188 170 C180 173 178 179 184 184
                 C182 200 166 212 138 210 L124 209 L162 280 Z" />
      </symbol>
      <symbol id="gear" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09c-.66 0-1.25.4-1.51 1z" />
        </g>
      </symbol>
    </defs>
  </svg>

  <div id="viewport">
    <div id="stage">

      <!-- ============ 1. Opening page ============ -->
      <section class="screen active" id="screen-opening">
        <h1 class="glow title">Dream Debate</h1>
        <h2 class="glow subtitle">Live Debates</h2>
        <p class="hint">click anywhere to begin</p>
      </section>

      <!-- ============ 2. Topic picker ============ -->
      <section class="screen" id="screen-topic-select">
        <h2 class="glow topic-select-title">Choose a Debate</h2>
        <div class="topic-list"></div>
      </section>

      <!-- ============ 3 & 4. Setup pages (one per bot) ============ -->
      <section class="screen setup-screen" id="screen-setup-a" data-bot="a">
        <button class="back-btn" aria-label="Back">
          <svg viewBox="0 0 40 20"><path d="M38 10H4M12 2 3 10l9 8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="end-btn">End Session</button>
        <div class="setup-head">
          <div class="char-mount" data-bot="a"></div>
          <div class="glow head-label"></div>
        </div>
        <div class="card setup-card purple"></div>
      </section>

      <section class="screen setup-screen" id="screen-setup-b" data-bot="b">
        <button class="back-btn" aria-label="Back">
          <svg viewBox="0 0 40 20"><path d="M38 10H4M12 2 3 10l9 8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="end-btn">End Session</button>
        <div class="setup-head">
          <div class="char-mount" data-bot="b"></div>
          <div class="glow head-label"></div>
        </div>
        <div class="card setup-card purple"></div>
      </section>

      <!-- ============ 5. Introducing the chatbots ============ -->
      <section class="screen" id="screen-intro">
        <div class="topic"><span>Topic:</span><strong class="glow"></strong></div>
        <button class="end-btn">End Session</button>
        <div class="intro-bot left">
          <div class="char-mount" data-bot="a"></div>
          <div class="glow head-label"></div>
        </div>
        <div class="intro-bot right">
          <div class="char-mount" data-bot="b"></div>
          <div class="glow head-label"></div>
        </div>
      </section>

      <!-- ============ 6. The ring ============ -->
      <section class="screen" id="screen-ring">
        <svg class="ring" viewBox="0 0 967 550" preserveAspectRatio="none">
          <!-- floor -->
          <polygon points="0,378 200,295 767,295 967,378 967,435 0,435" fill="#FDE7D8" />
          <!-- back ropes -->
          <g stroke="#fff" stroke-width="8">
            <line x1="204" y1="160" x2="773" y2="160" />
            <line x1="204" y1="197" x2="773" y2="197" />
            <line x1="204" y1="234" x2="773" y2="234" />
            <line x1="204" y1="271" x2="773" y2="271" />
          </g>
          <!-- side ropes -->
          <g stroke="#fff" stroke-width="9">
            <line x1="-5" y1="98" x2="204" y2="160" />
            <line x1="-5" y1="163" x2="204" y2="197" />
            <line x1="-5" y1="230" x2="204" y2="234" />
            <line x1="-5" y1="318" x2="204" y2="271" />
            <line x1="972" y1="98" x2="773" y2="160" />
            <line x1="972" y1="163" x2="773" y2="197" />
            <line x1="972" y1="230" x2="773" y2="234" />
            <line x1="972" y1="318" x2="773" y2="271" />
          </g>
          <!-- corner posts -->
          <rect x="183" y="110" width="42" height="190" rx="21" fill="#E80808" />
          <rect x="752" y="110" width="42" height="190" rx="21" fill="#E80808" />
        </svg>

        <div class="topic"><span>Topic:</span><strong class="glow"></strong></div>
        <button class="end-btn">End Session</button>
        <button type="button" id="chatbot-settings-btn" class="settings-btn" aria-label="Chatbot Settings">
          <svg viewBox="0 0 24 24"><use href="#gear" /></svg> Chatbot Settings
        </button>
        <button type="button" id="esp32-btn" class="esp32-btn" title="Connect the ESP32 talking LED over USB">
          <span class="esp32-dot" aria-hidden="true"></span><span class="esp32-label">Connect ESP32</span>
        </button>

        <div class="fighter left" data-bot="a">
          <div class="char-mount" data-bot="a"></div>
          <button class="bot-pause-btn" data-bot="a" aria-label="Pause" title="Pause">
            <svg class="icon-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"/></svg>
            <svg class="icon-play" viewBox="0 0 24 24"><path d="M7 4l14 8-14 8V4z" fill="currentColor"/></svg>
          </button>
          <div class="fighter-label"></div>
        </div>
        <div class="fighter right" data-bot="b">
          <div class="char-mount" data-bot="b"></div>
          <button class="bot-pause-btn" data-bot="b" aria-label="Pause" title="Pause">
            <svg class="icon-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"/></svg>
            <svg class="icon-play" viewBox="0 0 24 24"><path d="M7 4l14 8-14 8V4z" fill="currentColor"/></svg>
          </button>
          <div class="fighter-label"></div>
        </div>

        <!-- speech bubble -->
        <div id="bubble" class="bubble hidden" aria-live="polite">
          <button id="skip-line-btn" class="skip-btn hidden" aria-label="Skip to next" title="Skip to next">
            <svg viewBox="0 0 24 24"><path d="M4 5v14l10-7L4 5z" fill="currentColor"/><rect x="16" y="5" width="3" height="14" fill="currentColor"/></svg>
          </button>
          <div class="bubble-name"></div>
          <div class="bubble-text"></div>
        </div>

        <!-- user input -->
        <form id="chat-form" autocomplete="off">
          <div class="input-pill">
            <input id="chat-input" type="text" placeholder="Type Here" />
            <button type="submit" class="send" aria-label="Send">
              <svg viewBox="0 0 24 24"><path d="M22 2 2 10.5l8 2.5 2.5 8.5z" fill="#6c6c6c"/></svg>
            </button>
          </div>
          <button type="button" id="mic-btn" aria-label="Speak">
            <svg viewBox="0 0 24 40"><rect x="4" y="2" width="16" height="24" rx="8" fill="none" stroke="#fff" stroke-width="2.2"/><path d="M1 20c0 7 5 11 11 11s11-4 11-11M12 31v8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
        </form>

        <!-- settings popup: one global panel, both bots as accordion sections -->
        <div id="modal-backdrop" class="hidden">
          <div id="modal" class="card">
            <button type="button" class="close-btn modal-close-btn" aria-label="Close">
              <svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
            </button>
            <div class="card-title modal-title">Chatbot Settings</div>
            <div class="accordion">
              <div class="accordion-item" data-section="global"></div>
              <div class="accordion-item" data-bot="a"></div>
              <div class="accordion-item" data-bot="b"></div>
            </div>
          </div>
        </div>
      </section>

      <div id="toast" class="hidden"></div>
    </div>
  </div>

  <!-- setup form template (used by the setup pages and the popup) -->
  <template id="setup-form">
    <button type="button" class="close-btn" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
    <div class="card-title"></div>
    <div class="card-sub">Chatbot Setup</div>
    <p class="setup-hint"></p>

    <div class="field-group prompt-group">
      <label class="field-label">System Prompt</label>
      <div class="dropzone" tabindex="0" role="button">
        <span class="dz-text">Drop PDF here</span>
        <button type="button" class="dz-reset hidden">use default</button>
        <input type="file" accept=".pdf,.txt,.md,application/pdf,text/plain" hidden />
      </div>
      <div class="prompt-edit">
        <textarea class="prompt-textarea" rows="5" spellcheck="false"></textarea>
        <div class="prompt-edit-foot">
          <button type="button" class="prompt-upload-btn">Upload file instead</button>
          <span class="prompt-file-name"></span>
          <input type="file" class="prompt-file-input" accept=".pdf,.txt,.md,application/pdf,text/plain" hidden />
        </div>
      </div>
    </div>

    <div class="field-group voice-group">
      <label class="field-label">Voice</label>
      <div class="select-wrap">
        <select class="voice-select"></select>
        <svg viewBox="0 0 20 12"><path d="M2 2l8 8 8-8" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      </div>
      <div class="voice-sliders">
        <div class="slider-row">
          <div class="slider-head"><span>Voice Speed</span><span class="slider-val speed-val"></span></div>
          <input type="range" class="speed-slider" min="0.7" max="1.2" step="0.01" />
        </div>
        <div class="slider-row">
          <div class="slider-head"><span>Voice Pitch</span><span class="slider-val pitch-val"></span></div>
          <input type="range" class="pitch-slider" min="0" max="2" step="0.1" />
          <span class="slider-note">Browser voice fallback only — ElevenLabs has no pitch control</span>
        </div>
      </div>
    </div>

    <div class="knowledge-block hidden">
      <label class="field-label">Knowledge Notes <span class="kn-count">(0/2)</span></label>
      <p class="setup-hint kn-hint">Drag 2 PDF (or text) files onto the box below to give this bot real research to cite.</p>
      <div class="kn-drop" tabindex="0" role="button" aria-label="Drop knowledge note files here">
        <span class="kn-drop-text">Drop up to 2 files here, or click to browse</span>
        <input type="file" accept=".pdf,.txt,.md,application/pdf,text/plain" multiple hidden />
      </div>
      <div class="kn-files"></div>
    </div>

    <div class="btn-row">
      <button type="button" class="preview-btn" aria-label="Preview voice" title="Preview voice">&#9654;</button>
      <button type="button" class="apply-btn">Apply Changes</button>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
